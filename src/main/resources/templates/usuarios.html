
<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestión de usuarios</title>

    <link rel="stylesheet"
          th:href="@{/css/estilos.css}">

    <link rel="stylesheet"
          th:href="@{/css/productos.css}">
</head>

<body>

<!-- ENCABEZADO -->
<div th:replace="~{fragments/header :: encabezado}"></div>

<main class="contenedor-productos"
      sec:authorize="hasRole('ADMIN')">

    <!-- INFORMACIÓN GENERAL -->
    <section class="tarjeta-productos">

        <h2>Administración de usuarios</h2>

        <p>
            Desde esta sección puede registrar usuarios,
            asignar roles y administrar sus accesos.
        </p>

        <p>
            Administrador:
            <strong sec:authentication="name"></strong>
        </p>

    </section>

    <!-- FORMULARIO DE REGISTRO -->
    <section class="tarjeta-productos">

        <h2>Registrar usuario</h2>

        <form th:action="@{/usuarios/guardar}"
              method="post">

            <!-- NOMBRE COMPLETO -->
            <label for="nombre">
                Nombre completo
            </label>

            <input type="text"
                   id="nombre"
                   name="nombre"
                   placeholder="Nombre completo"
                   maxlength="100"
                   required>

            <!-- USUARIO -->
            <label for="username">
                Nombre de usuario
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Nombre de usuario"
                   maxlength="50"
                   autocomplete="off"
                   required>

            <!-- CONTRASEÑA -->
            <label for="password">
                Contraseña
            </label>

            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Contraseña"
                   autocomplete="new-password"
                   minlength="8"
                   required>

            <!-- ROL -->
            <label for="rolId">
                Rol del usuario
            </label>

            <select id="rolId"
                    name="rolId"
                    required>

                <option value="">
                    Seleccione un rol
                </option>

                <option th:each="rol : ${roles}"
                        th:value="${rol.id}"
                        th:text="${rol.nombre}">
                </option>

            </select>

            <!-- BOTÓN GUARDAR -->
            <button type="submit"
                    class="btn-guardar">
                Registrar usuario
            </button>

        </form>

    </section>

    <!-- LISTA DE USUARIOS -->
    <section class="tarjeta-productos">

        <h2>Usuarios registrados</h2>

        <div class="tabla-contenedor">

            <table>

                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Usuario</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>

                <!-- RECORRER USUARIOS -->
                <tr th:each="usuario : ${usuarios}">

                    <td th:text="${usuario.id}"></td>

                    <td th:text="${usuario.nombre}"></td>

                    <td th:text="${usuario.username}"></td>

                    <td th:text="${usuario.rol.nombre}"></td>

                    <!-- ESTADO -->
                    <td>
                        <span th:if="${usuario.activo}">
                            Activo
                        </span>

                        <span th:unless="${usuario.activo}">
                            Inactivo
                        </span>
                    </td>

                    <!-- ACCIONES -->
                    <td class="acciones">

                        <!-- ACTIVAR O DESACTIVAR -->
                        <form th:action="@{/usuarios/estado/{id}
                              (id=${usuario.id})}"
                              method="post">

                            <button type="submit"
                                    class="btn-eliminar"
                                    th:text="${usuario.activo}
                                        ? 'Desactivar'
                                        : 'Activar'">
                                Cambiar estado
                            </button>

                        </form>

                    </td>

                </tr>

                <!-- SIN USUARIOS -->
                <tr th:if="${#lists.isEmpty(usuarios)}">

                    <td colspan="6">
                        No hay usuarios registrados.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </section>

    <!-- VOLVER A PRODUCTOS -->
    <a th:href="@{/productos}"
       class="volver-inico">
        Volver a productos
    </a>

</main>

<!-- PIE DE PÁGINA -->
<div th:replace="~{fragments/footer :: piePagina}"></div>

</body>
</html>
