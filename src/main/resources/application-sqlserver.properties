# Conexion SQL Server Express
logging.level.org.springframework.security=TRACE
#spring.datasource.url=jdbc:mysql://localhost:3306/BDProductos
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BDProductos;encrypt=true;trustServerCertificate=true
#spring.datasource.username=${ebv}
#spring.datasource.password=${nara8900}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true